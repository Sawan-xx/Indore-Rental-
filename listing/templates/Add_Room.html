{% extends 'home.html' %}

{% block data %}
<body class="bg-light py-5 ">

  <div class="container d-flex justify-content-center align-items-center mt-3">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 fw-bold text-primary">Add New Room</h3>

          <form method="POST" action="{% url 'add_room' %}">
            {% csrf_token %}

            <!-- Hidden Owner Field (logged-in user) -->
            {% if user.is_authenticated %}
              <input type="hidden" name="owner" value="{{ user.id }}">
            {% endif %}

            <!-- Room Title -->
            <div class="mb-3">
              <label for="title" class="form-label fw-semibold">Room Title</label>
              <input type="text" class="form-control form-control-lg rounded-3" id="title" name="title" placeholder="Enter room title" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="description" class="form-label fw-semibold">Description</label>
              <textarea class="form-control form-control-lg rounded-3" id="description" name="description" rows="4" placeholder="Describe your room" required></textarea>
            </div>

            <!-- Price per Month -->
            <div class="mb-3">
              <label for="price" class="form-label fw-semibold">Price per Month (₹)</label>
              <input type="number" class="form-control form-control-lg rounded-3" id="price" name="price" min="0" placeholder="Enter price" required>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label for="address" class="form-label fw-semibold">Address</label>
              <input type="text" class="form-control form-control-lg rounded-3" id="address" name="address" placeholder="Enter room address" required>
            </div>

           <div class="mb-3">
              <label for="images" class="form-label fw-semibold">Upload Images</label>
              <input 
                type="file" 
                name="images" 
                id="images" 
                class="form-control" 
                multiple 
                accept="image/*"
              >
            </div>

            <!-- Preview Area -->
            <div id="preview-container" class="d-flex flex-wrap gap-3 mt-3"></div>





            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg rounded-3 shadow-sm">
                Add Room
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
<!-- JavaScript for Image Preview -->
<script>
document.getElementById('images').addEventListener('change', function(event) {
    const previewContainer = document.getElementById('preview-container');
    previewContainer.innerHTML = ''; // clear old previews

    const files = event.target.files;
    if (files) {
        [...files].forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.classList.add('rounded-3', 'shadow-sm');
                img.style.width = '120px';
                img.style.height = '100px';
                img.style.objectFit = 'cover';
                previewContainer.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
</body>

{% endblock data %}
