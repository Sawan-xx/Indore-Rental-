{% extends 'home.html' %}

{% block data %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white text-center rounded-top-4">
          <h3 class="mb-0">Edit Profile</h3>
        </div>

        <div class="card-body p-4">
          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="first_name" class="form-label fw-semibold">First Name</label>
              <input type="text" name="first_name" id="first_name" class="form-control"
                     value="{{ request.user.first_name }}" placeholder="Enter first name">
            </div>

            <div class="mb-3">
              <label for="last_name" class="form-label fw-semibold">Last Name</label>
              <input type="text" name="last_name" id="last_name" class="form-control"
                     value="{{ request.user.last_name }}" placeholder="Enter last name">
            </div>

            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" name="username" id="username" class="form-control"
                     value="{{ request.user.username }}" readonly>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input type="email" name="email" id="email" class="form-control"
                     value="{{ request.user.email }}" placeholder="Enter email">
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" id="phone" class="form-control"
                     value="{{ request.user.phone }}" placeholder="Enter phone number">
            </div>

            <div class="mb-3">
              <label for="address" class="form-label fw-semibold">Address</label>
              <textarea name="address" id="address" rows="3" class="form-control"
                        placeholder="Enter your address">{{ request.user.address }}</textarea>
            </div>

            <div class="mb-3">
              <label for="user_type" class="form-label fw-semibold">User Type</label>
              <select name="user_type" id="user_type" class="form-select">
                <option value="Owner" {% if request.user.user_type == "Owner" %}selected{% endif %}>Owner</option>
                <option value="Renter" {% if request.user.user_type == "Renter" %}selected{% endif %}>Renter</option>
              </select>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary px-4">Save Changes</button>
              <a href="{% url 'account' %}" class="btn btn-secondary px-4 ms-2">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock data %}
